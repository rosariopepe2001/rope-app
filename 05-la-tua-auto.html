<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ROPE — La tua auto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="assets/app.css" rel="stylesheet">
<style>
  .passi{display:flex;gap:6px;margin:0 0 24px}
  .passi span{flex:1;height:3px;border-radius:2px;background:var(--border)}
  .passi span.on{background:var(--accent)}
  .passi-txt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);margin-bottom:10px}
  label{display:block;font-size:13px;color:var(--text-2);margin:18px 0 6px;font-weight:500}
  input[type=text],textarea{width:100%;min-height:52px;background:var(--surface);color:var(--text);
    border:1px solid var(--border);border-radius:12px;padding:14px;font-family:var(--body);font-size:16px}
  textarea{min-height:100px;resize:vertical}
  input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .due{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>

<header class="top">
  <a href="04-data-e-ora.html" aria-label="Indietro"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span></a>
  <span class="titolo">La tua auto</span>
  <span style="min-width:44px"></span>
</header>

<main>
  <div class="passi-txt">Passo 3 di 4 · La tua auto</div>
  <div class="passi"><span class="on"></span><span class="on"></span><span class="on"></span><span></span></div>

  <div class="selettore">
    <div class="tit">Conferma la taglia</div>
    <div class="chips" id="chips" role="group" aria-label="Taglia dell'auto"></div>
    <p class="spiega" id="spiega"></p>
  </div>

  <div class="sezione" style="margin-top:0">I tuoi dati</div>
  <div class="due">
    <div><label for="nome">Nome e cognome</label><input type="text" id="nome" placeholder="Mario Rossi" autocomplete="name"></div>
    <div><label for="telefono">Telefono</label><input type="text" id="telefono" placeholder="333 1234567" inputmode="tel" autocomplete="tel"></div>
  </div>
  <p id="errore" style="color:#E8807A;font-size:13px;margin:10px 0 0" hidden></p>

  <div class="sezione">L'auto</div>
  <div class="due">
    <div><label for="marca">Marca</label><input type="text" id="marca" placeholder="BMW"></div>
    <div><label for="modello">Modello</label><input type="text" id="modello" placeholder="Serie 3"></div>
  </div>
  <div class="due">
    <div><label for="targa">Targa</label><input type="text" id="targa" placeholder="GF921XT"></div>
    <div><label for="colore">Colore</label><input type="text" id="colore" placeholder="Nero"></div>
  </div>

  <label for="note">Note per il detailer (facoltativo)</label>
  <textarea id="note" placeholder="Macchie sui sedili posteriori, cerchi molto sporchi…"></textarea>
</main>

<div class="barra">
  <div class="totale"><small>Totale</small><b id="tot">—</b></div>
  <button class="btn primario" id="avanti">Continua</button>
</div>

<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
const $ = s => document.querySelector(s);

(async function(){
  try{ await ROPE.carica(); }catch(e){}
  const s = ROPE.selezione();
  const a = s.auto || {}, cl = s.cliente || {};
  $("#nome").value = cl.nome || ""; $("#telefono").value = cl.telefono || "";
  $("#marca").value = a.marca || ""; $("#modello").value = a.modello || "";
  $("#targa").value = a.targa || ""; $("#colore").value = a.colore || "";
  $("#note").value = s.note || "";

  ROPE.disegnaChipsTaglia('#chips', aggiornaTotale);
  aggiornaTotale();
})();

function aggiornaTotale(){
  $("#spiega").innerHTML = ROPE.testoSpiegaTaglia();
  $("#tot").textContent = ROPE.totale().testo;
}

$("#avanti").addEventListener('click', () => {
  const nome = $("#nome").value.trim(), tel = $("#telefono").value.trim();
  if(nome.length < 2 || tel.replace(/[^0-9]/g,'').length < 8){
    const e = $("#errore");
    e.textContent = "Servono nome e numero di telefono per confermare la prenotazione.";
    e.hidden = false;
    (nome.length < 2 ? $("#nome") : $("#telefono")).focus();
    return;
  }
  $("#errore").hidden = true;
  ROPE.aggiorna({
    cliente:{nome, telefono:tel},
    auto:{marca:$("#marca").value.trim(), modello:$("#modello").value.trim(),
          targa:$("#targa").value.trim().toUpperCase(), colore:$("#colore").value.trim()},
    note:$("#note").value.trim(),
    taglia: ROPE.taglia()
  });
  location.href = '06-riepilogo.html';
});
</script>
</body>
</html>

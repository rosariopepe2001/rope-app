<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ROPE — La tua auto</title>
<link href="assets/app.css" rel="stylesheet">
<style>
  .passi{display:flex;gap:6px;margin:0 0 24px}
  .passi span{flex:1;height:3px;border-radius:2px;background:var(--border)}
  .passi span.on{background:var(--accent)}
  .passi-txt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);margin-bottom:10px}
  label{display:block;font-size:13px;color:var(--text-2);margin:18px 0 6px;font-weight:500}
  input[type=text],textarea{width:100%;min-height:52px;background:var(--surface);color:var(--text);
    border:1px solid var(--border);border-radius:12px;padding:14px;font-family:var(--body);font-size:16px}
  textarea{min-height:100px;resize:vertical}
  input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .due{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* le auto già salvate: si toccano e riempiono i campi qui sotto */
  .salvate{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
  .salvate::-webkit-scrollbar{display:none}
  .salvate button{flex:0 0 auto;min-height:60px;min-width:150px;max-width:230px;
       text-align:left;background:var(--surface);border:1px solid var(--border);
       border-radius:14px;padding:12px 14px;color:var(--text);font-family:var(--body);
       cursor:pointer;transition:border-color .2s,background .2s}
  .salvate button .m{display:block;font-family:var(--headline);font-size:14px;font-weight:600;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .salvate button .t{display:block;font-size:12px;color:var(--text-2);margin-top:3px;letter-spacing:.06em}
  .salvate button[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2)}
  .salvate button[aria-pressed="true"] .t{color:var(--accent)}
  .salvate button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<header class="top">
  <a href="04-data-e-ora.html" aria-label="Indietro"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span></a>
  <span class="titolo">La tua auto</span>
  <span style="min-width:44px"></span>
</header>

<main>
  <div class="passi-txt">Passo 3 di 4 · La tua auto</div>
  <div class="passi"><span class="on"></span><span class="on"></span><span class="on"></span><span></span></div>

  <div class="selettore">
    <div class="tit">Conferma la taglia</div>
    <div class="chips" id="chips" role="group" aria-label="Taglia dell'auto"></div>
    <p class="spiega" id="spiega"></p>
  </div>

  <div class="sezione" style="margin-top:0">I tuoi dati</div>
  <div class="due">
    <div><label for="nome">Nome e cognome</label><input type="text" id="nome" placeholder="Mario Rossi" autocomplete="name"></div>
    <div><label for="telefono">Telefono</label><input type="text" id="telefono" placeholder="333 1234567" inputmode="tel" autocomplete="tel"></div>
  </div>
  <p id="errore" style="color:#E8807A;font-size:13px;margin:10px 0 0" hidden></p>

  <div class="sezione">L'auto</div>
  <div id="zona-salvate" hidden>
    <p style="font-size:13px;color:var(--text-2);margin:0 0 10px">
      Le tue auto — tocca quella che porti e i campi si riempiono da soli.</p>
    <div class="salvate" id="salvate" role="group" aria-label="Le auto che hai già usato"></div>
  </div>
  <div class="due">
    <div><label for="marca">Marca</label><input type="text" id="marca" placeholder="BMW"></div>
    <div><label for="modello">Modello</label><input type="text" id="modello" placeholder="Serie 3"></div>
  </div>
  <div class="due">
    <div><label for="targa">Targa</label><input type="text" id="targa" placeholder="GF921XT" autocapitalize="characters" autocorrect="off" spellcheck="false"></div>
    <div><label for="colore">Colore</label><input type="text" id="colore" placeholder="Nero"></div>
  </div>

  <label for="note">Note per il detailer (facoltativo)</label>
  <textarea id="note" placeholder="Macchie sui sedili posteriori, cerchi molto sporchi…"></textarea>
</main>

<div class="barra">
  <div class="totale"><small>Totale</small><b id="tot">—</b></div>
  <button class="btn primario" id="avanti">Continua</button>
</div>

<script src="assets/config.js"></script>
<script src="assets/account.js"></script>
<script src="assets/app.js"></script>
<script>
const $ = s => document.querySelector(s);
let ridisegnaTaglie = null;

/* per prenotare serve l'account: se manca, si va alla schermata di accesso */
if(!ROPE_ACCOUNT.serveAccesso()) throw new Error('accesso richiesto');

(async function(){
  try{ await ROPE.carica(); }catch(e){}
  const s = ROPE.selezione();
  const a = s.auto || {}, cl = s.cliente || {};
  const io = ROPE_ACCOUNT.chiSono() || {};

  // nome e telefono arrivano dall'account: non li deve riscrivere ogni volta
  $("#nome").value = cl.nome || io.nome || "";
  $("#telefono").value = cl.telefono || io.telefono || "";
  $("#marca").value = a.marca || ""; $("#modello").value = a.modello || "";
  $("#targa").value = a.targa || ""; $("#colore").value = a.colore || "";
  $("#note").value = s.note || "";

  ridisegnaTaglie = ROPE.disegnaChipsTaglia('#chips', aggiornaTotale);
  aggiornaTotale();

  mostraAutoSalvate();
})();

function aggiornaTotale(){
  $("#spiega").innerHTML = ROPE.testoSpiegaTaglia();
  $("#tot").textContent = ROPE.totale().testo;
}

/* ---- le auto già salvate ----
   Chi è già venuto non deve riscrivere marca, modello e targa: tocca la
   sua auto e i campi si riempiono, taglia compresa. */
function autoScrittaOra(){
  return {marca: $("#marca").value.trim(), modello: $("#modello").value.trim(),
          targa: $("#targa").value.trim().toUpperCase(), colore: $("#colore").value.trim()};
}

function segnaSceltaAuto(){
  const ora = ROPE.chiaveAuto(autoScrittaOra());
  document.querySelectorAll('#salvate button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.chiave === ora && !!ora));
  });
}

async function mostraAutoSalvate(){
  let elenco = [];
  try{ elenco = await ROPE.mieAuto(); }catch(e){ return; }
  if(!elenco.length) return;

  const c = $("#salvate");
  c.innerHTML = "";
  elenco.forEach(auto => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.chiave = ROPE.chiaveAuto(auto);
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<span class="m">${ROPE.esc(ROPE.nomeAuto(auto) || 'La mia auto')}</span>
      <span class="t">${ROPE.esc(auto.targa || auto.colore || 'tocca per usarla')}</span>`;
    b.addEventListener('click', () => {
      $("#marca").value = auto.marca || ""; $("#modello").value = auto.modello || "";
      $("#targa").value = auto.targa || ""; $("#colore").value = auto.colore || "";
      if(auto.taglia && ROPE.dati && (ROPE.dati.taglie||[]).some(t => t.id === auto.taglia)){
        ROPE.impostaTaglia(auto.taglia);
        ROPE.aggiorna({taglia: auto.taglia});
        if(ridisegnaTaglie) ridisegnaTaglie();
      }
      aggiornaTotale();
      segnaSceltaAuto();
    });
    c.appendChild(b);
  });

  $("#zona-salvate").hidden = false;
  segnaSceltaAuto();
  ["marca","modello","targa","colore"].forEach(id =>
    $("#" + id).addEventListener('input', segnaSceltaAuto));
}

$("#avanti").addEventListener('click', async () => {
  const nome = $("#nome").value.trim(), tel = $("#telefono").value.trim();
  if(nome.length < 2 || tel.replace(/[^0-9]/g,'').length < 8){
    const e = $("#errore");
    e.textContent = "Servono nome e numero di telefono per confermare la prenotazione.";
    e.hidden = false;
    (nome.length < 2 ? $("#nome") : $("#telefono")).focus();
    return;
  }
  $("#errore").hidden = true;

  // se li ha corretti, se li ritrova corretti anche la prossima volta
  const io = ROPE_ACCOUNT.chiSono() || {};
  if(nome !== io.nome || tel !== io.telefono){
    try{ await ROPE_ACCOUNT.aggiornaDati(nome, tel); }
    catch(e){ /* non blocchiamo la prenotazione per questo */ }
  }

  ROPE.aggiorna({
    cliente:{nome, telefono:tel},
    auto:{marca:$("#marca").value.trim(), modello:$("#modello").value.trim(),
          targa:$("#targa").value.trim().toUpperCase(), colore:$("#colore").value.trim()},
    note:$("#note").value.trim(),
    taglia: ROPE.taglia()
  });
  location.href = '06-riepilogo.html';
});
</script>
</body>
</html>

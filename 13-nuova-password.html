<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ROPE Car Detailing — Nuova password</title>
<link href="assets/font.css" rel="stylesheet">
<link href="assets/app.css" rel="stylesheet">
<style>
  body{padding-bottom:0}
  main{max-width:460px;margin:0 auto;
       padding:calc(40px + env(safe-area-inset-top)) 22px calc(60px + env(safe-area-inset-bottom));
       min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
  .logo-grande{width:150px;height:auto;display:block;margin:0 auto 34px}
  h1{font-family:var(--headline);font-size:21px;font-weight:600;letter-spacing:.12em;
     text-transform:uppercase;margin:0 0 6px;text-align:center}
  .sub{color:var(--text-2);font-size:14px;text-align:center;margin:0 0 30px;line-height:1.5}
  label{display:block;font-size:13px;color:var(--text-2);margin:0 0 6px;font-weight:500}
  input{width:100%;min-height:52px;background:var(--surface);color:var(--text);
        border:1px solid var(--border);border-radius:14px;padding:14px 16px;
        font-family:var(--body);font-size:16px;margin:0 0 16px}
  input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .messaggio{font-size:14px;line-height:1.5;margin:0 0 16px;padding:14px 16px;
             border-radius:12px;border:1px solid var(--border)}
  .messaggio.errore{color:var(--danger);border-color:rgba(232,128,122,.4)}
  .messaggio.ok{color:var(--ok);border-color:rgba(127,191,154,.4)}
  .btn-pieno{width:100%;min-height:54px;border-radius:99px;border:none;
       background:var(--accent);color:var(--bg);font-family:var(--headline);
       font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
       cursor:pointer;transition:background .2s}
  .btn-pieno:disabled{opacity:.5;cursor:default}
  .minore{background:none;border:none;color:var(--text-2);font-family:var(--body);
       font-size:14px;cursor:pointer;padding:10px 0;min-height:44px;display:block;margin:18px auto 0}
</style>
</head>
<body>

<main>
  <img class="logo-grande" src="assets/rope-logo.png" alt="ROPE Car Detailing">

  <h1>Nuova password</h1>
  <p class="sub" id="sottotitolo">Scegli la password che userai da adesso in poi.</p>

  <p class="messaggio" id="messaggio" role="alert" hidden></p>

  <form id="modulo" novalidate>
    <label for="p1">Nuova password</label>
    <input type="password" id="p1" autocomplete="new-password" placeholder="almeno 6 caratteri">

    <label for="p2">Riscrivila</label>
    <input type="password" id="p2" autocomplete="new-password" placeholder="la stessa di sopra">

    <button class="btn-pieno" type="submit" id="salva">Salva la password</button>
  </form>

  <button class="minore" type="button" id="torna">Torna all'accesso</button>
</main>

<script src="assets/config.js"></script>
<script src="assets/account.js"></script>
<script>
const $ = s => document.querySelector(s);

function messaggio(testo, tipo){
  const m = $("#messaggio");
  if(!testo){ m.hidden = true; return; }
  m.textContent = testo;
  m.className = 'messaggio ' + (tipo || 'errore');
  m.hidden = false;
}

$("#torna").addEventListener('click', () => location.replace('10-accesso.html'));

/* Il collegamento dell'email porta qui con un gettone dentro l'indirizzo,
   dopo il cancelletto. Con quello si può cambiare la password una volta
   sola: lo prendiamo e ripuliamo subito la barra dell'indirizzo. */
let gettone = "";
(function(){
  const pezzi = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
  gettone = pezzi.get('access_token') || "";
  const guaio = pezzi.get('error_description') || pezzi.get('error');
  history.replaceState(null, "", location.pathname);

  if(guaio || !gettone){
    $("#modulo").hidden = true;
    $("#sottotitolo").textContent = "";
    messaggio(/expired/i.test(guaio || "")
      ? "Questo collegamento è scaduto. Torna all'accesso e chiedine un altro con «Ho dimenticato la password»."
      : "Questo collegamento non è più valido. Torna all'accesso e chiedine un altro con «Ho dimenticato la password».");
  }
})();

$("#modulo").addEventListener('submit', async e => {
  e.preventDefault();
  const p1 = $("#p1").value, p2 = $("#p2").value;
  messaggio(null);

  if(p1.length < 6){
    messaggio("La password deve avere almeno 6 caratteri.");
    $("#p1").focus();
    return;
  }
  if(p1 !== p2){
    messaggio("Le due password non sono uguali. Riscrivile.");
    $("#p2").focus();
    return;
  }

  const b = $("#salva");
  b.disabled = true; b.textContent = 'Salvo…';
  try{
    const c = window.ROPE_CONFIG || {};
    const r = await fetch(String(c.URL).replace(/\/$/, "") + "/auth/v1/user", {
      method: "PUT",
      headers: {"apikey": c.CHIAVE_PUBBLICA, "Authorization": "Bearer " + gettone,
                "Content-Type": "application/json"},
      body: JSON.stringify({password: p1})
    });
    const o = await r.json().catch(() => ({}));
    if(!r.ok){
      /* i messaggi di Supabase arrivano in inglese e tecnici: qui si dice
         quello che serve davvero sapere */
      const m = String(o.msg || o.message || o.error_description || "");
      if(/bearer token|invalid|expired|jwt/i.test(m))
        throw new Error("Questo collegamento non vale più: aprilo dall'email più " +
                        "recente, oppure chiedine un altro dall'accesso.");
      if(/at least|6 characters|weak/i.test(m))
        throw new Error("La password è troppo debole: mettine una più lunga.");
      if(/same.*password|different from the old/i.test(m))
        throw new Error("Questa è la stessa password di prima: scegline una diversa.");
      throw new Error("Non sono riuscito a cambiarla. Riprova fra un momento.");
    }

    $("#modulo").hidden = true;
    messaggio("Password cambiata. Adesso puoi entrare con quella nuova.", 'ok');
    setTimeout(() => location.replace('10-accesso.html'), 2500);
  }catch(ex){
    messaggio(ex.message);
    b.disabled = false; b.textContent = 'Salva la password';
  }
});
</script>
</body>
</html>

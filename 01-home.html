<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ROPE Car Detailing — Home</title>
<link href="assets/font.css" rel="stylesheet">
<link href="assets/app.css" rel="stylesheet">
<style>
  .saluto{font-family:var(--headline);font-size:28px;font-weight:700;margin:0}
  .saluto + p{color:var(--text-2);font-size:14px;margin:4px 0 24px}
  .promo{background:var(--accent);color:var(--bg);border-radius:16px;padding:14px 18px;
         display:flex;align-items:center;gap:12px;margin-bottom:24px;
         font-family:var(--headline);font-weight:600;font-size:14px;letter-spacing:.02em}
  .appunt{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px}
  .appunt .riga{display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:14px;margin-top:8px}
  .appunt .riga .material-symbols-outlined{font-size:18px}
  .appunt h3{font-family:var(--headline);font-size:19px;margin:0;font-weight:600}
  .scorri{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;
          scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .scorri::-webkit-scrollbar{display:none}
  .mini{flex:0 0 240px;scroll-snap-align:start;background:var(--surface);
        border:1px solid var(--border);border-radius:18px;padding:18px;
        cursor:pointer;text-align:left;color:inherit;font:inherit;transition:border-color .2s}
  .mini:hover{border-color:var(--accent)}
  .mini .pk{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2)}
  .mini h4{font-family:var(--headline);font-size:16px;margin:6px 0 0;font-weight:600;line-height:1.3}
  .mini .pz{font-family:var(--headline);font-weight:700;font-size:20px;color:var(--accent);margin-top:14px}
  .mini .pz span{font-family:var(--body);font-size:11px;font-weight:400;color:var(--text-2)}
  .lavoro{flex:0 0 200px;scroll-snap-align:start;border-radius:18px;overflow:hidden;
          position:relative;aspect-ratio:4/5;background:var(--surface-2);border:1px solid var(--border);
          padding:0;cursor:pointer;color:inherit;display:block;text-align:left;
          transition:border-color .2s}
  .lavoro:hover{border-color:var(--accent)}
  .lavoro:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .lavoro img{width:100%;height:100%;object-fit:cover;display:block}

  /* Mentre l'app legge i dati non deve raccontare bugie: prima scriveva
     subito "Nessun appuntamento" anche a chi ne aveva uno, e cambiava un
     attimo dopo. Ora al posto del testo c'è una barretta che respira. */
  .scheletro{display:inline-block;color:transparent!important;border-radius:7px;
             background:var(--surface-2);animation:respira 1.4s ease-in-out infinite;
             user-select:none;min-height:1em;vertical-align:middle}
  .scheletro *{visibility:hidden}
  .mini.scheletro,.lavoro.scheletro{border-color:var(--border);animation:respira 1.4s ease-in-out infinite}
  @keyframes respira{0%,100%{opacity:.5}50%{opacity:.85}}
  @media (prefers-reduced-motion:reduce){.scheletro{animation:none;opacity:.6}}
  .lavoro .cap{position:absolute;left:0;right:0;bottom:0;padding:14px;
               background:linear-gradient(transparent,rgba(10,10,11,.92));font-size:13px;font-weight:600}
</style>
</head>
<body>

<header class="top">
  <img class="logo" src="assets/rope-logo.png" alt="ROPE Car Detailing">
  <div style="display:flex;gap:4px">
    <a href="09-profilo.html" aria-label="Profilo"><span class="material-symbols-outlined" aria-hidden="true">account_circle</span></a>
  </div>
</header>

<main>
  <h2 class="saluto">Ciao</h2>
  <p>Il tuo prossimo appuntamento</p>

  <div id="promo"></div>

  <div class="appunt">
    <h3 id="app-titolo" class="scheletro" style="width:62%">Carico…</h3>
    <div class="riga"><span class="material-symbols-outlined" aria-hidden="true">event</span>
      <span id="app-quando" class="scheletro" style="width:52%">Carico…</span></div>
    <a class="btn primario pieno" href="02-servizi.html" style="margin-top:18px">Prenota un servizio</a>
  </div>

  <div class="sezione" style="display:flex;justify-content:space-between;align-items:center">
    <span>Servizi</span>
    <a href="02-servizi.html" style="color:var(--text-2);text-decoration:none;font-family:var(--body);
       font-size:12px;letter-spacing:0;text-transform:none;display:inline-flex;align-items:center;
       min-height:44px;padding:0 4px;margin:-10px -4px">Vedi tutti</a>
  </div>
  <div class="scorri" id="servizi"></div>

  <div class="sezione" style="display:flex;justify-content:space-between;align-items:center">
    <span>I nostri lavori</span>
    <a href="08-galleria.html" style="color:var(--text-2);text-decoration:none;font-family:var(--body);
       font-size:12px;letter-spacing:0;text-transform:none;display:inline-flex;align-items:center;
       min-height:44px;padding:0 4px;margin:-10px -4px">Vedi l'album</a>
  </div>
  <div class="scorri" id="lavori"></div>
</main>

<nav class="tab">
  <a href="01-home.html" class="attivo"><span class="material-symbols-outlined" aria-hidden="true">home</span>Home</a>
  <a href="02-servizi.html"><span class="material-symbols-outlined" aria-hidden="true">list</span>Servizi</a>
  <a href="11-prenotazioni.html"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>Prenotazioni</a>
  <a href="09-profilo.html"><span class="material-symbols-outlined" aria-hidden="true">person</span>Profilo</a>
</nav>

<script src="assets/config.js"></script>
<script src="assets/account.js"></script>
<script src="assets/avvisi.js"></script>
<script src="assets/app.js"></script>
<script>
const $ = s => document.querySelector(s);

/* Riquadri vuoti che respirano finché i dati non arrivano: così si vede
   subito la forma della pagina, invece del nero e di scritte sbagliate. */
function scheletri(){
  $("#servizi").innerHTML = '<div class="mini scheletro" aria-hidden="true"></div>'.repeat(2);
  $("#lavori").innerHTML  = '<div class="lavoro scheletro" aria-hidden="true"></div>'.repeat(2);
}
function fineScheletro(elemento){
  elemento.classList.remove('scheletro');
  elemento.style.width = '';
}
scheletri();

(async function(){
  let d;
  try{ d = await ROPE.carica(); }
  catch(e){
    $("#servizi").innerHTML = '<p class="vuoto">Servizi non disponibili.</p>';
    $("#lavori").innerHTML = '';
    fineScheletro($("#app-titolo")); fineScheletro($("#app-quando"));
    $("#app-titolo").textContent = 'Nessun appuntamento';
    $("#app-quando").textContent = 'Riprova quando torna la connessione';
    return;
  }

  /* promozione */
  if(d.promo && d.promo.attiva && d.promo.testo){
    $("#promo").innerHTML =
      `<div class="promo"><span class="material-symbols-outlined" aria-hidden="true">local_offer</span>
       ${ROPE.esc(d.promo.testo)}</div>`;
  }

  /* Prossimo appuntamento: letto dal database, non dalla memoria del
     telefono. Così se il centro lo completa o lo annulla, qui sparisce
     senza bisogno di riavviare l'app. */
  const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno',
                'luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
  const STATI = {nuova:'In attesa di conferma', confermata:'Confermata'};

  async function mostraProssimo(){
    const v = await ROPE.prossimoAppuntamento();
    fineScheletro($("#app-titolo")); fineScheletro($("#app-quando"));
    if(!v){
      $("#app-titolo").textContent = 'Nessun appuntamento';
      $("#app-quando").textContent = 'Prenota il tuo primo trattamento';
      return;
    }
    $("#app-titolo").textContent = v.servizio || 'Servizio';
    let quando = 'Data da definire';
    if(v.data_app){
      const d = new Date(v.data_app + 'T00:00:00');
      quando = GIORNI[d.getDay()] + ' ' + d.getDate() + ' ' + MESI[d.getMonth()];
    }
    $("#app-quando").textContent = quando + (v.ora ? ' · ' + v.ora : '')
      + (STATI[v.stato] ? ' · ' + STATI[v.stato] : '');
  }
  mostraProssimo();
  /* si riaggiorna da solo mentre la home è aperta: se il centro conferma
     o annulla, qui cambia senza dover cambiare schermata */
  ROPE.tieniAggiornato(mostraProssimo, 15000);

  /* carosello servizi: tutti i livelli attivi */
  const cont = $("#servizi"); cont.innerHTML = "";
  d.pacchetti.filter(p => p.attivo !== false).forEach(p => {
    (p.livelli||[]).filter(l => l.attivo !== false).forEach(l => {
      const b = document.createElement('button');
      b.className = 'mini'; b.type = 'button';
      const testo = ROPE.testoPrezzo(l);
      b.innerHTML = `<div class="pk">${ROPE.esc(p.nome)}</div>
        <h4>${ROPE.esc(l.titolo || l.nome)}</h4>
        <div class="pz">${testo === 'Su richiesta' ? '' : '<span>da </span>'}${testo}</div>`;
      b.addEventListener('click', () => {
        location.href = `03-dettaglio-servizio.html?p=${encodeURIComponent(p.id)}&l=${encodeURIComponent(l.id)}`;
      });
      cont.appendChild(b);
    });
  });

  /* galleria */
  const g = $("#lavori");
  // un lavoro può avere più foto: nel carosello si vede la prima
  const copertina = l => (Array.isArray(l.foto) ? l.foto.filter(Boolean)[0]
                                                : l.foto) || l.dopo || l.prima || "";
  const album = d.galleria.filter(l => copertina(l));
  g.innerHTML = "";                 // via i segnaposto del caricamento
  if(!album.length){
    g.innerHTML = '<p class="vuoto" style="padding:24px 0;font-size:14px">' +
                  'Nessun lavoro pubblicato ancora.</p>';
  }else{
    album.forEach(l => {
      const b = document.createElement('button');
      b.className = 'lavoro'; b.type = 'button';
      b.innerHTML = `<img src="${ROPE.esc(copertina(l))}" alt="${ROPE.esc(l.auto||'Lavoro ROPE')}" loading="lazy">
        <div class="cap">${ROPE.esc(l.auto || '')}<br>
          <span style="font-weight:400;color:var(--text-2)">${ROPE.esc(l.servizio||'')}</span></div>`;
      b.addEventListener('click', () => location.href = '08-galleria.html');
      g.appendChild(b);
    });
  }
})();

/* riallinea i promemoria alle prenotazioni vere: se il centro ha spostato
   o annullato qualcosa, gli avvisi sul telefono si correggono da soli */
if(window.ROPE_AVVISI) ROPE_AVVISI.aggiorna().catch(() => {});
</script>
</body>
</html>

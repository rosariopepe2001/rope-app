<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ROPE Car Detailing — I nostri lavori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="assets/app.css" rel="stylesheet">
<style>
  .filtri{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:24px}
  .filtri::-webkit-scrollbar{display:none}
  .f{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--border);
     background:var(--surface);color:var(--text-2);cursor:pointer;font-family:var(--body);
     font-size:14px;transition:background .2s,color .2s,border-color .2s}
  .f[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
  .f:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .griglia{columns:2;column-gap:12px}
  @media (min-width:640px){.griglia{columns:3}}
  .tessera{break-inside:avoid;margin-bottom:12px;border-radius:18px;overflow:hidden;
           position:relative;background:var(--surface-2);border:1px solid var(--border);
           cursor:pointer;width:100%;padding:0;display:block;color:inherit;transition:border-color .2s}
  .tessera:hover{border-color:var(--accent)}
  .tessera img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover}
  .tessera .senza{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
  .tessera .bd{position:absolute;top:10px;left:10px;background:rgba(10,10,11,.82);
               border:1px solid var(--border);border-radius:99px;padding:4px 10px;
               font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .tessera .cap{position:absolute;left:0;right:0;bottom:0;padding:14px;text-align:left;
                background:linear-gradient(transparent,rgba(10,10,11,.94));font-size:13px;font-weight:600}
  .tessera .cap small{display:block;font-weight:400;color:var(--text-2);margin-top:2px}

  /* confronto prima/dopo */
  dialog{border:none;padding:0;background:var(--bg);color:var(--text);width:100%;
         max-width:560px;border-radius:20px;margin:auto}
  dialog::backdrop{background:rgba(0,0,0,.88)}
  .testata{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px}
  .testata h2{font-family:var(--headline);font-size:17px;margin:0;font-weight:600}
  .testata button{background:none;border:none;color:var(--text);cursor:pointer;
                  min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
  .confronto{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--surface-2)}
  .confronto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .confronto .dopo{clip-path:inset(0 0 0 50%)}
  .confronto .maniglia{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--accent);
                       pointer-events:none;transform:translateX(-1px)}
  .confronto .maniglia::after{content:"";position:absolute;top:50%;left:50%;width:40px;height:40px;
                              border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);
                              box-shadow:0 2px 12px rgba(0,0,0,.5)}
  .confronto .et{position:absolute;bottom:12px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
                 background:rgba(10,10,11,.8);border-radius:99px;padding:4px 10px;color:var(--text-2)}
  .confronto .et.p{left:12px} .confronto .et.d{right:12px;color:var(--accent)}
  .cursore{position:absolute;inset:0;width:100%;opacity:0;cursor:ew-resize;margin:0}
  .info{padding:20px}
  .info p{color:var(--text-2);font-size:14px;margin:6px 0 0}
</style>
</head>
<body>

<header class="top">
  <img class="logo" src="assets/rope-logo.png" alt="ROPE Car Detailing">
  <span style="min-width:44px"></span>
</header>

<main>
  <h1 class="tit">I nostri lavori</h1>
  <p class="intro">Trascina il cursore per vedere il prima e il dopo.</p>
  <div class="filtri" id="filtri" role="group" aria-label="Filtra per servizio"></div>
  <div class="griglia" id="griglia"></div>
</main>

<nav class="tab">
  <a href="01-home.html"><span class="material-symbols-outlined">home</span>Home</a>
  <a href="02-servizi.html"><span class="material-symbols-outlined">list</span>Servizi</a>
  <a href="04-data-e-ora.html"><span class="material-symbols-outlined">calendar_month</span>Prenotazioni</a>
  <a href="09-profilo.html"><span class="material-symbols-outlined">person</span>Profilo</a>
</nav>

<dialog id="dlg">
  <div class="testata">
    <h2 id="dlg-titolo"></h2>
    <button id="chiudi" aria-label="Chiudi"><span class="material-symbols-outlined">close</span></button>
  </div>
  <div class="confronto" id="confronto">
    <img id="im-prima" alt="Prima dell'intervento">
    <img id="im-dopo" class="dopo" alt="Dopo l'intervento">
    <div class="maniglia" id="maniglia"></div>
    <span class="et p">Prima</span><span class="et d">Dopo</span>
    <input type="range" class="cursore" id="cursore" min="0" max="100" value="50"
           aria-label="Confronta prima e dopo">
  </div>
  <div class="info">
    <h3 style="font-family:var(--headline);margin:0;font-size:17px" id="dlg-servizio"></h3>
    <p id="dlg-nota"></p>
    <a class="btn primario pieno" href="02-servizi.html" style="margin-top:18px">Prenota questo servizio</a>
  </div>
</dialog>

<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
const $ = s => document.querySelector(s);
let lavori = [], filtro = 'Tutti';

(async function(){
  let d;
  try{ d = await ROPE.carica(); }
  catch(e){ $("#griglia").innerHTML = '<p class="vuoto">Galleria non disponibile.</p>'; return; }
  lavori = d.galleria || [];
  disegnaFiltri(); disegna();
})();

function servizi(){
  return ['Tutti', ...new Set(lavori.map(l => l.servizio).filter(Boolean))];
}

function disegnaFiltri(){
  const c = $("#filtri"); c.innerHTML = "";
  const elenco = servizi();
  if(elenco.length <= 1){ c.hidden = true; return; }
  elenco.forEach(s => {
    const b = document.createElement('button');
    b.className = 'f'; b.type = 'button'; b.textContent = s;
    b.setAttribute('aria-pressed', s === filtro);
    b.addEventListener('click', () => { filtro = s; disegnaFiltri(); disegna(); });
    c.appendChild(b);
  });
}

function disegna(){
  const g = $("#griglia"); g.innerHTML = "";
  const elenco = filtro === 'Tutti' ? lavori : lavori.filter(l => l.servizio === filtro);

  if(!elenco.length){
    g.innerHTML = `<p class="vuoto" style="column-span:all">
      Nessun lavoro pubblicato ancora.<br>
      <span style="font-size:13px">Carica le foto prima/dopo dal pannello di gestione.</span></p>`;
    return;
  }

  elenco.forEach(l => {
    const b = document.createElement('button');
    b.className = 'tessera'; b.type = 'button';
    b.innerHTML = `
      ${l.dopo ? `<img src="${ROPE.esc(l.dopo)}" alt="${ROPE.esc(l.auto || 'Lavoro')}">`
               : `<div class="senza"><span class="material-symbols-outlined">image</span></div>`}
      ${(l.prima && l.dopo) ? '<span class="bd">Prima / Dopo</span>' : ''}
      <div class="cap">${ROPE.esc(l.auto || 'Senza titolo')}
        <small>${ROPE.esc(l.servizio || '')}</small></div>`;
    b.addEventListener('click', () => apri(l));
    g.appendChild(b);
  });
}

function apri(l){
  $("#dlg-titolo").textContent = l.auto || 'Lavoro';
  $("#dlg-servizio").textContent = l.servizio || '';
  $("#dlg-nota").textContent = l.nota || '';
  $("#im-prima").src = l.prima || l.dopo || '';
  $("#im-dopo").src = l.dopo || l.prima || '';
  muovi(50); $("#cursore").value = 50;
  $("#dlg").showModal();
}

function muovi(v){
  $("#im-dopo").style.clipPath = `inset(0 0 0 ${v}%)`;
  $("#maniglia").style.left = v + '%';
}

$("#cursore").addEventListener('input', e => muovi(e.target.value));
$("#chiudi").addEventListener('click', () => $("#dlg").close());
</script>
</body>
</html>

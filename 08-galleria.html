<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ROPE Car Detailing — I nostri lavori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="assets/app.css" rel="stylesheet">
<style>
  .filtri{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:24px}
  .filtri::-webkit-scrollbar{display:none}
  .f{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--border);
     background:var(--surface);color:var(--text-2);cursor:pointer;font-family:var(--body);
     font-size:14px;transition:background .2s,color .2s,border-color .2s}
  .f[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
  .f:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* griglia vera, non a colonne: le foto si leggono nell'ordine in cui
     le ha messe lui nel pannello, da sinistra a destra */
  .griglia{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (min-width:640px){.griglia{grid-template-columns:repeat(3,1fr)}}
  .tessera{border-radius:18px;overflow:hidden;
           position:relative;background:var(--surface-2);border:1px solid var(--border);
           cursor:pointer;width:100%;padding:0;display:block;color:inherit;transition:border-color .2s}
  .tessera:hover{border-color:var(--accent)}
  .tessera:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tessera img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover}
  .tessera .senza{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
  .tessera .cap{position:absolute;left:0;right:0;bottom:0;padding:14px;text-align:left;
                background:linear-gradient(transparent,rgba(10,10,11,.94));font-size:13px;font-weight:600}
  .tessera .cap small{display:block;font-weight:400;color:var(--text-2);margin-top:2px}

  /* la foto a schermo pieno */
  dialog{border:none;padding:0;background:transparent;color:var(--text);
         width:100%;max-width:100%;height:100%;max-height:100%;margin:0}
  dialog::backdrop{background:rgba(6,6,7,.96)}
  .visore{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);
          padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .visore .barra-alta{display:flex;align-items:center;justify-content:space-between;
          gap:12px;padding:8px 12px;flex:0 0 auto}
  .visore .conta{font-size:12px;letter-spacing:.14em;color:var(--text-2)}
  .visore .barra-alta button{background:none;border:none;color:var(--text);cursor:pointer;
          min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
  .palco{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;
         min-height:0;padding:0 8px;touch-action:pan-y}
  .palco img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;display:block}
  .palco .senza{color:var(--text-2)}
  .sfoglia{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;
           border-radius:50%;border:1px solid var(--border);background:rgba(22,22,26,.9);
           color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .sfoglia:hover{border-color:var(--accent)}
  .sfoglia:disabled{opacity:.3;cursor:not-allowed}
  .sfoglia.pre{left:10px} .sfoglia.suc{right:10px}
  .didascalia{flex:0 0 auto;padding:16px 20px 20px;max-width:720px;margin:0 auto;width:100%}
  .didascalia h2{font-family:var(--headline);font-size:19px;margin:0;font-weight:700}
  .didascalia .srv{color:var(--accent);font-size:13px;letter-spacing:.08em;
                   text-transform:uppercase;margin-top:4px;font-weight:600}
  .didascalia p{color:var(--text-2);font-size:14px;margin:10px 0 0}
</style>
</head>
<body>

<header class="top">
  <img class="logo" src="assets/rope-logo.png" alt="ROPE Car Detailing">
  <span style="min-width:44px"></span>
</header>

<main>
  <h1 class="tit">I nostri lavori</h1>
  <p class="intro">L'album delle auto uscite dal nostro centro. Tocca una foto per vederla grande.</p>
  <div class="filtri" id="filtri" role="group" aria-label="Filtra per servizio"></div>
  <div class="griglia" id="griglia"></div>
</main>

<nav class="tab">
  <a href="01-home.html"><span class="material-symbols-outlined" aria-hidden="true">home</span>Home</a>
  <a href="02-servizi.html"><span class="material-symbols-outlined" aria-hidden="true">list</span>Servizi</a>
  <a href="11-prenotazioni.html"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>Prenotazioni</a>
  <a href="09-profilo.html"><span class="material-symbols-outlined" aria-hidden="true">person</span>Profilo</a>
</nav>

<dialog id="dlg" aria-label="Foto del lavoro">
  <div class="visore">
    <div class="barra-alta">
      <span class="conta" id="conta"></span>
      <button id="chiudi" aria-label="Chiudi"><span class="material-symbols-outlined" aria-hidden="true">close</span></button>
    </div>
    <div class="palco" id="palco">
      <button class="sfoglia pre" id="precedente" aria-label="Foto precedente">
        <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span></button>
      <img id="foto" alt="">
      <button class="sfoglia suc" id="successiva" aria-label="Foto successiva">
        <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></button>
    </div>
    <div class="didascalia">
      <h2 id="dlg-auto"></h2>
      <div class="srv" id="dlg-servizio"></div>
      <p id="dlg-nota"></p>
      <a class="btn primario pieno" href="02-servizi.html" style="margin-top:18px">Prenota questo servizio</a>
    </div>
  </div>
</dialog>

<script src="assets/config.js"></script>
<script src="assets/account.js"></script>
<script src="assets/app.js"></script>
<script>
const $ = s => document.querySelector(s);
let lavori = [], filtro = 'Tutti', visibili = [], indice = 0;

/* Le schede vecchie avevano prima/dopo: se ce ne fossero, si tiene la
   foto del "dopo" e l'album continua a funzionare lo stesso. */
const fotoDi = l => l.foto || l.dopo || l.prima || "";

(async function(){
  let d;
  try{ d = await ROPE.carica(); }
  catch(e){ $("#griglia").innerHTML = '<p class="vuoto">Galleria non disponibile.</p>'; return; }
  lavori = (d.galleria || []).filter(l => fotoDi(l));
  disegnaFiltri(); disegna();
})();

function servizi(){
  return ['Tutti', ...new Set(lavori.map(l => l.servizio).filter(Boolean))];
}

function disegnaFiltri(){
  const c = $("#filtri"); c.innerHTML = "";
  const elenco = servizi();
  if(elenco.length <= 1){ c.hidden = true; return; }
  c.hidden = false;
  elenco.forEach(s => {
    const b = document.createElement('button');
    b.className = 'f'; b.type = 'button'; b.textContent = s;
    b.setAttribute('aria-pressed', s === filtro);
    b.addEventListener('click', () => { filtro = s; disegnaFiltri(); disegna(); });
    c.appendChild(b);
  });
}

function disegna(){
  const g = $("#griglia"); g.innerHTML = "";
  visibili = filtro === 'Tutti' ? lavori : lavori.filter(l => l.servizio === filtro);

  if(!visibili.length){
    g.innerHTML = `<p class="vuoto" style="grid-column:1/-1">
      Nessuna foto pubblicata ancora.<br>
      <span style="font-size:13px">Presto qui trovi i lavori usciti dal nostro centro.</span></p>`;
    return;
  }

  visibili.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'tessera'; b.type = 'button';
    b.innerHTML = `
      <img src="${ROPE.esc(fotoDi(l))}" alt="${ROPE.esc(l.auto || 'Lavoro ROPE')}" loading="lazy">
      <div class="cap">${ROPE.esc(l.auto || 'Senza titolo')}
        <small>${ROPE.esc(l.servizio || '')}</small></div>`;
    b.addEventListener('click', () => apri(i));
    g.appendChild(b);
  });
}

/* ---- foto a schermo pieno, si sfoglia come un album ---- */
function apri(i){
  indice = i;
  mostra();
  $("#dlg").showModal();
}

function mostra(){
  const l = visibili[indice];
  if(!l) return;
  $("#foto").src = fotoDi(l);
  $("#foto").alt = l.auto || 'Lavoro ROPE';
  $("#dlg-auto").textContent = l.auto || 'Lavoro';
  $("#dlg-servizio").textContent = l.servizio || '';
  const nota = $("#dlg-nota");
  nota.textContent = l.nota || '';
  nota.hidden = !l.nota;
  $("#conta").textContent = (indice + 1) + ' di ' + visibili.length;
  $("#precedente").disabled = indice === 0;
  $("#successiva").disabled = indice === visibili.length - 1;
  // con una foto sola le frecce non servono
  const sola = visibili.length < 2;
  $("#precedente").hidden = sola; $("#successiva").hidden = sola;
  $("#conta").hidden = sola;
}

function scorri(passo){
  const nuovo = indice + passo;
  if(nuovo < 0 || nuovo >= visibili.length) return;
  indice = nuovo; mostra();
}

$("#precedente").addEventListener('click', () => scorri(-1));
$("#successiva").addEventListener('click', () => scorri(1));
$("#chiudi").addEventListener('click', () => $("#dlg").close());
$("#dlg").addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft')  scorri(-1);
  if(e.key === 'ArrowRight') scorri(1);
});

/* si sfoglia anche con il dito, come nelle foto del telefono */
let partenza = null;
const palco = $("#palco");
palco.addEventListener('touchstart', e => { partenza = e.touches[0].clientX; }, {passive:true});
palco.addEventListener('touchend', e => {
  if(partenza === null) return;
  const spostamento = e.changedTouches[0].clientX - partenza;
  partenza = null;
  if(Math.abs(spostamento) > 50) scorri(spostamento < 0 ? 1 : -1);
}, {passive:true});
</script>
</body>
</html>

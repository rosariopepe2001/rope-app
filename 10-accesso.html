<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ROPE Car Detailing — Accedi</title>
<link href="assets/font.css" rel="stylesheet">
<link href="assets/app.css" rel="stylesheet">
<style>
  body{padding-bottom:0}
  /* la zona di sicurezza in cima: senza, la Dynamic Island copre il logo */
  main{max-width:460px;margin:0 auto;
       padding:calc(40px + env(safe-area-inset-top)) 22px calc(60px + env(safe-area-inset-bottom));
       min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
  .logo-grande{width:150px;height:auto;display:block;margin:0 auto 34px}
  h1{font-family:var(--headline);font-size:21px;font-weight:600;letter-spacing:.12em;
     text-transform:uppercase;margin:0 0 6px;text-align:center}
  .sub{color:var(--text-2);font-size:14px;text-align:center;margin:0 0 30px;line-height:1.5}

  label{display:block;font-size:13px;color:var(--text-2);margin:0 0 6px;font-weight:500}
  input{width:100%;min-height:52px;background:var(--surface);color:var(--text);
        border:1px solid var(--border);border-radius:14px;padding:14px 16px;
        font-family:var(--body);font-size:16px;margin:0 0 16px}
  input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .messaggio{font-size:14px;line-height:1.5;margin:0 0 16px;padding:14px 16px;
             border-radius:12px;border:1px solid var(--border)}
  .messaggio.errore{color:var(--danger);border-color:rgba(232,128,122,.4)}
  .messaggio.ok{color:var(--ok);border-color:rgba(127,191,154,.4)}

  .btn-pieno{width:100%;min-height:54px;border-radius:99px;border:none;
       background:var(--accent);color:var(--bg);font-family:var(--headline);
       font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
       cursor:pointer;transition:background .2s}
  .btn-pieno:hover{background:#E6E9ED}
  .btn-pieno:disabled{opacity:.5;cursor:default}

  /* Accedi con Apple: bianco su nero, come chiede Apple nelle sue linee guida */
  .oppure{display:flex;align-items:center;gap:14px;margin:22px 0;
          color:var(--text-2);font-size:13px}
  .oppure::before,.oppure::after{content:"";flex:1;height:1px;background:var(--border)}
  .btn-apple{width:100%;min-height:54px;border-radius:99px;border:1px solid #fff;
       background:#fff;color:#000;font-family:var(--body);font-size:17px;font-weight:600;
       cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
  .btn-apple:disabled{opacity:.5;cursor:default}
  .btn-apple .mela{width:18px;height:20px;margin-top:-3px}

  /* Continua con Google: fondo scuro e bordo chiaro, come permette Google */
  .btn-google{width:100%;min-height:54px;border-radius:99px;border:1px solid var(--border);
       background:var(--surface);color:var(--text);font-family:var(--body);font-size:16px;
       font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;
       gap:10px;margin-bottom:12px;transition:border-color .2s}
  .btn-google:hover{border-color:var(--accent)}
  .btn-google:disabled{opacity:.5;cursor:default}
  .btn-google .g{width:20px;height:20px;flex:0 0 auto}

  .cambia{text-align:center;margin-top:26px;font-size:14px;color:var(--text-2)}
  .cambia button{background:none;border:none;color:var(--accent);font-family:var(--body);
       font-size:14px;font-weight:600;cursor:pointer;padding:10px 6px;min-height:44px}
  .minore{background:none;border:none;color:var(--text-2);font-family:var(--body);
       font-size:13px;cursor:pointer;padding:10px 0;min-height:44px;display:block;margin:0 auto}
  .nota-privacy{color:var(--text-2);font-size:12px;line-height:1.55;text-align:center;margin:24px 0 0}
  .nota-privacy a{color:var(--text-2)}
</style>
</head>
<body>

<main>
  <img class="logo-grande" src="assets/rope-logo.png" alt="ROPE Car Detailing">

  <h1 id="titolo">Accedi</h1>
  <p class="sub" id="sottotitolo">Entra per prenotare e ritrovare i tuoi appuntamenti.</p>

  <p class="messaggio" id="messaggio" role="alert" hidden></p>

  <form id="modulo" novalidate>
    <div id="campi-registrazione" hidden>
      <label for="c-nome">Nome e cognome</label>
      <input type="text" id="c-nome" autocomplete="name" placeholder="Mario Rossi">

      <label for="c-tel">Numero di telefono</label>
      <input type="tel" id="c-tel" autocomplete="tel" inputmode="tel" placeholder="327 1234567">
    </div>

    <label for="c-email">Email</label>
    <input type="email" id="c-email" autocomplete="email" inputmode="email"
           spellcheck="false" placeholder="la tua email">

    <label for="c-password">Password</label>
    <input type="password" id="c-password" autocomplete="current-password"
           placeholder="almeno 6 caratteri">

    <button class="btn-pieno" type="submit" id="invia">Entra</button>
  </form>

  <div class="oppure" id="oppure" hidden><span>oppure</span></div>

  <div id="google-blocco" hidden>
    <button class="btn-google" type="button" id="google">
      <svg class="g" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
        <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
        <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
        <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
      </svg>
      Continua con Google
    </button>
  </div>

  <div id="apple-blocco" hidden>
    <button class="btn-apple" type="button" id="apple">
      <svg class="mela" viewBox="0 0 384 512" aria-hidden="true">
        <path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
      </svg>
      Accedi con Apple
    </button>
  </div>

  <button class="minore" type="button" id="dimenticata">Ho dimenticato la password</button>
  <button class="minore" type="button" id="ospite">Guarda i servizi senza registrarti</button>

  <p class="cambia" id="cambia-riga">
    <span id="cambia-testo">Non hai ancora un account?</span>
    <button type="button" id="cambia">Registrati</button>
  </p>

  <p class="nota-privacy">Registrandoti accetti che usiamo nome, telefono e dati
     dell'auto solo per gestire le prenotazioni.<br>
     <a href="privacy.html">Informativa sulla privacy</a></p>
</main>

<script src="assets/config.js"></script>
<script src="assets/account.js"></script>
<script>
const $ = s => document.querySelector(s);
let modo = 'entra';          // 'entra' oppure 'registra'

const torna = new URLSearchParams(location.search).get('torna') || '01-home.html';

/* Se stiamo tornando da Google, il gettone arriva dentro l'indirizzo:
   si raccoglie prima di ogni altra cosa. Poi, chi è già entrato non
   deve rivedere questa schermata. */
(async function(){
  const dove = localStorage.getItem('rope-torna') || torna;
  try{
    const s = await ROPE_ACCOUNT.raccogliRitornoGoogle();
    if(s){
      localStorage.removeItem('rope-torna');
      location.replace(dove);
      return;
    }
  }catch(ex){
    localStorage.removeItem('rope-torna');
    messaggio(ex.message);
  }
  if(ROPE_ACCOUNT.dentro()) location.replace(dove);
})();

function messaggio(testo, tipo){
  const m = $("#messaggio");
  if(!testo){ m.hidden = true; return; }
  m.textContent = testo;
  m.className = 'messaggio ' + (tipo || 'errore');
  m.hidden = false;
  m.scrollIntoView({block:'nearest'});
}

function impostaModo(nuovo){
  modo = nuovo;
  const reg = modo === 'registra';
  $("#campi-registrazione").hidden = !reg;
  $("#titolo").textContent = reg ? 'Crea il tuo account' : 'Accedi';
  $("#sottotitolo").textContent = reg
    ? 'Ti serve per prenotare e per ritrovare i tuoi appuntamenti.'
    : 'Entra per prenotare e ritrovare i tuoi appuntamenti.';
  $("#invia").textContent = reg ? 'Registrati' : 'Entra';
  $("#cambia-testo").textContent = reg ? 'Hai già un account?' : 'Non hai ancora un account?';
  $("#cambia").textContent = reg ? 'Accedi' : 'Registrati';
  $("#c-password").setAttribute('autocomplete', reg ? 'new-password' : 'current-password');
  $("#dimenticata").hidden = reg;
  messaggio(null);
}

$("#cambia").addEventListener('click', () => impostaModo(modo === 'entra' ? 'registra' : 'entra'));

$("#modulo").addEventListener('submit', async e => {
  e.preventDefault();
  const b = $("#invia"), testoIniziale = b.textContent;
  messaggio(null);
  b.disabled = true; b.textContent = modo === 'registra' ? 'Ti registro…' : 'Entro…';
  try{
    if(modo === 'registra')
      await ROPE_ACCOUNT.registra($("#c-email").value, $("#c-password").value,
                                  $("#c-nome").value, $("#c-tel").value);
    else
      await ROPE_ACCOUNT.entra($("#c-email").value, $("#c-password").value);
    location.replace(torna);
    return;
  }catch(ex){
    messaggio(ex.message, ex.motivo === 'conferma' ? 'ok' : 'errore');
    if(ex.motivo === 'conferma') impostaModo('entra');
  }
  b.disabled = false; b.textContent = testoIniziale;
});

$("#dimenticata").addEventListener('click', async () => {
  const email = $("#c-email").value.trim();
  /* Senza email non si può fare niente, ma va detto in modo che si capisca:
     si porta il dito dove serve, invece di dare un messaggio e basta. */
  if(!email){
    messaggio("Scrivi qui sopra la tua email, poi tocca di nuovo " +
              "«Ho dimenticato la password»: ti mandiamo il collegamento per rifarla.", 'ok');
    const campo = $("#c-email");
    campo.focus();
    campo.scrollIntoView({block:'center', behavior:'smooth'});
    return;
  }
  const b = $("#dimenticata");
  b.disabled = true;
  try{
    await ROPE_ACCOUNT.passwordDimenticata(email);
    messaggio("Fatto: abbiamo mandato un'email a " + email + ". Aprila e tocca il " +
              "collegamento per scegliere una password nuova. Se non arriva entro " +
              "qualche minuto, guarda nella posta indesiderata.", 'ok');
  }catch(ex){ messaggio(ex.message); }
  b.disabled = false;
});

/* Accesso con Google: funziona sia dentro l'app sia dal browser.
   Si apre la pagina di Google e si torna qui col gettone. */
if(ROPE_ACCOUNT.googleDisponibile()){
  $("#google-blocco").hidden = false;
  $("#oppure").hidden = false;
  $("#google").addEventListener('click', async () => {
    const b = $("#google"), testo = b.lastChild.textContent;
    messaggio(null);
    b.disabled = true; b.lastChild.textContent = ' Attendo Google…';
    // dal browser la pagina se ne va: ricordiamo dove stava andando
    try{ localStorage.setItem('rope-torna', torna); }catch(e){}
    try{
      await ROPE_ACCOUNT.conGoogle();
      localStorage.removeItem('rope-torna');
      location.replace(torna);
      return;
    }catch(ex){ messaggio(ex.message); }
    b.disabled = false; b.lastChild.textContent = testo;
  });
}

/* Chi vuole solo dare un'occhiata ai prezzi entra come ospite: la scelta
   dura finché l'app resta aperta, poi si torna a chiedere l'accesso.
   Per prenotare l'account serve comunque. */
$("#ospite").addEventListener('click', () => {
  try{ sessionStorage.setItem('rope-ospite', '1'); }catch(e){}
  location.replace('01-home.html');
});

/* Il pulsante Apple si vede solo dentro l'app: nel browser non funzionerebbe */
if(ROPE_ACCOUNT.appleDisponibile()){
  $("#apple-blocco").hidden = false;
  $("#oppure").hidden = false;
  $("#apple").addEventListener('click', async () => {
    const b = $("#apple"), testo = b.lastChild.textContent;
    messaggio(null);
    b.disabled = true; b.lastChild.textContent = ' Attendo Apple…';
    try{
      await ROPE_ACCOUNT.conApple();
      location.replace(torna);
      return;
    }catch(ex){ messaggio(ex.message); }
    b.disabled = false; b.lastChild.textContent = testo;
  });
}

impostaModo('entra');
</script>
</body>
</html>

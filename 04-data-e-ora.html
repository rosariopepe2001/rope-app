<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ROPE — Data e ora</title>
<link href="assets/font.css" rel="stylesheet">
<link href="assets/app.css" rel="stylesheet">
<style>
  .passi{display:flex;gap:6px;margin:0 0 24px}
  .passi span{flex:1;height:3px;border-radius:2px;background:var(--border)}
  .passi span.on{background:var(--accent)}
  .passi-txt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
             color:var(--text-2);margin-bottom:10px}
  .scelto{background:var(--surface);border:1px solid var(--border);border-radius:16px;
          padding:16px;display:flex;align-items:center;justify-content:space-between;
          gap:14px;margin-bottom:28px}
  .scelto .n{font-size:15px;font-weight:600}
  .scelto .m{font-size:12px;color:var(--text-2);margin-top:3px}
  .scelto .p{font-family:var(--headline);font-weight:700;font-size:19px;color:var(--accent);white-space:nowrap}
  .mese{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .mese h2{font-family:var(--headline);font-size:17px;margin:0;font-weight:600;text-transform:capitalize}
  .mese button{background:none;border:1px solid var(--border);border-radius:50%;color:var(--text);
               width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mese button:disabled{opacity:.3;cursor:not-allowed}
  .griglia{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .griglia .gg{text-align:center;font-size:11px;color:var(--text-2);padding:6px 0;text-transform:uppercase}
  .giorno{aspect-ratio:1;border:none;background:none;color:var(--text);border-radius:50%;
          font-family:var(--body);font-size:15px;cursor:pointer;min-height:44px;
          display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
  .giorno:hover:not(:disabled){background:var(--surface-2)}
  .giorno:disabled{color:#3A3A42;cursor:not-allowed}
  .giorno[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:600}
  .giorno:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .orari{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ora{min-height:48px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
       color:var(--text);font-family:var(--body);font-size:15px;cursor:pointer;transition:background .2s}
  .ora[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
  .ora:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ora:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
  .niente{grid-column:1/-1;color:var(--text-2);font-size:14px;text-align:center;
          padding:20px 0;line-height:1.6;margin:0}
</style>
</head>
<body>

<header class="top">
  <a href="03-dettaglio-servizio.html" aria-label="Indietro"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span></a>
  <span class="titolo">Prenota</span>
  <span style="min-width:44px"></span>
</header>

<main>
  <div class="passi-txt">Passo 2 di 4 · Data e ora</div>
  <div class="passi"><span class="on"></span><span class="on"></span><span></span><span></span></div>

  <div class="scelto" id="scelto"></div>

  <div class="mese">
    <button id="prec" aria-label="Mese precedente"><span class="material-symbols-outlined" aria-hidden="true">chevron_left</span></button>
    <h2 id="nome-mese"></h2>
    <button id="succ" aria-label="Mese successivo"><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></button>
  </div>
  <div class="griglia" id="calendario"></div>

  <div class="sezione" id="titolo-orari">Orari disponibili</div>
  <div class="orari" id="orari"></div>
  <p class="spiega" id="riconsegna" style="margin-top:16px" hidden></p>
</main>

<div class="barra">
  <div class="totale"><small>Totale</small><b id="tot">—</b></div>
  <button class="btn primario" id="avanti" disabled>Continua</button>
</div>

<script src="assets/config.js"></script>
<script src="assets/account.js"></script>
<script src="assets/app.js"></script>
<script>
const $ = s => document.querySelector(s);
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio',
              'agosto','settembre','ottobre','novembre','dicembre'];
const GG = ['lun','mar','mer','gio','ven','sab','dom'];

const oggi = new Date(); oggi.setHours(0,0,0,0);
let vista = new Date(oggi.getFullYear(), oggi.getMonth(), 1);
let scelta = null, ora = null, durata = 120, giorni = 1;

(async function(){
  try{ await ROPE.carica(); }catch(e){}
  const s = ROPE.selezione();
  const t = s.pacchettoId ? ROPE.trovaLivello(s.pacchettoId, s.livelloId) : null;
  const soliExtra = ROPE.soloExtra(s);

  if(!t && !soliExtra){
    $("#scelto").innerHTML =
      '<div><div class="n">Nessun servizio scelto</div>' +
      '<div class="m">Torna ai servizi per sceglierne uno</div></div>' +
      '<a class="btn" href="02-servizi.html">Servizi</a>';
  }else{
    const tot = ROPE.totale();
    const nEx = (s.extra||[]).length;
    const sotto = soliExtra
      ? (nEx === 1 ? 'Un servizio extra' : nEx + ' servizi extra')
      : ROPE.esc(ROPE.tagliaOggetto()?.nome || '') + (nEx ? ' · ' + nEx + ' extra' : '');
    $("#scelto").innerHTML =
      `<div><div class="n">${ROPE.esc(ROPE.nomeDellaSelezione(s))}</div>
        <div class="m">${sotto}</div></div>
       <div class="p">${tot.testo}</div>`;
    $("#tot").textContent = tot.testo;
    giorni = ROPE.giorniDellaSelezione(s);
    if(giorni > 1) $("#titolo-orari").textContent = 'Giorno di inizio';
    if(ROPE.daValutare(s)){
      $("#titolo-orari").textContent = 'Quando ci porti l\'auto';
      const avviso = document.createElement('p');
      avviso.className = 'nota';
      avviso.style.margin = '0 0 18px';
      avviso.innerHTML = '<span class="material-symbols-outlined" aria-hidden="true">info</span>' +
        '<span>Per questo lavoro la durata dipende da com\'è messa la vernice: ' +
        'si capisce solo vedendo l\'auto. Scegli il giorno in cui ce la porti, ' +
        'ti diciamo noi quanti giorni servono.</span>';
      $("#scelto").after(avviso);
    }
  }

  disegnaMese(); disegnaOrari();
})();

function disegnaMese(){
  $("#nome-mese").textContent = MESI[vista.getMonth()] + ' ' + vista.getFullYear();
  $("#prec").disabled = vista.getFullYear() === oggi.getFullYear() && vista.getMonth() === oggi.getMonth();

  const c = $("#calendario"); c.innerHTML = "";
  GG.forEach(g => c.insertAdjacentHTML('beforeend', `<div class="gg">${g}</div>`));

  const primo = new Date(vista.getFullYear(), vista.getMonth(), 1);
  const spazi = (primo.getDay() + 6) % 7;              // settimana che parte da lunedì
  for(let i=0;i<spazi;i++) c.insertAdjacentHTML('beforeend', '<div></div>');

  const giorni = new Date(vista.getFullYear(), vista.getMonth()+1, 0).getDate();
  for(let g=1; g<=giorni; g++){
    const data = new Date(vista.getFullYear(), vista.getMonth(), g);
    const b = document.createElement('button');
    b.className = 'giorno'; b.type = 'button'; b.textContent = g;
    const chiuso = ROPE.giornoChiuso(data);
    b.disabled = data < oggi || chiuso;
    b.setAttribute('aria-pressed', !!(scelta && data.getTime() === scelta.getTime()));
    if(chiuso) b.title = 'Chiuso';
    b.addEventListener('click', async () => {
      ROPE.tocco();
      scelta = data; ora = null; disegnaMese(); controlla();
      await disegnaOrari();
      /* scelto il giorno, la pagina scende da sola sugli orari:
         altrimenti restano sotto il bordo e sembra non sia successo niente */
      $("#titolo-orari").scrollIntoView({behavior:'smooth', block:'start'});
    });
    c.appendChild(b);
  }
}

async function disegnaOrari(){
  /* lavori a durata da valutare: si sceglie solo il giorno di consegna,
     l'orario è l'apertura. Proporre una griglia di orari sarebbe finto. */
  const sel = ROPE.selezione();
  if(ROPE.daValutare(sel)){
    const c = $("#orari");
    if(!scelta){
      c.innerHTML = '<p class="vuoto" style="padding:20px 0;font-size:14px">Scegli prima un giorno.</p>';
      return;
    }
    const g = ((ROPE.dati.disponibilita||{}).giorni||{})[String(scelta.getDay()===0?7:scelta.getDay())];
    ora = (g && g.da) || '09:00';
    c.innerHTML = '<p class="vuoto" style="padding:12px 0;font-size:14px">' +
      'Ci porti l\'auto la mattina del giorno scelto, dalle ' + ora + '.</p>';
    controlla();
    return;
  }

  const c = $("#orari");

  if(!scelta){
    c.innerHTML = '<p class="niente">Scegli prima un giorno.</p>';
    return;
  }

  /* servizi che occupano più giornate intere: niente orari, solo il giorno */
  if(giorni > 1){
    c.innerHTML = '<p class="niente">Controllo…</p>';
    const ok = await ROPE.giorniLiberi(scelta, giorni);
    if(ok){
      ora = 'giornata';
      c.innerHTML = `<p class="niente">Questo trattamento occupa
        <b style="color:var(--text)">${giorni} giornate intere</b>.<br>
        Iniziamo il ${scelta.getDate()} ${MESI[scelta.getMonth()]}, l'auto resta in officina
        fino alla sera del giorno dopo.</p>`;
    }else{
      ora = null;
      c.innerHTML = '<p class="niente">Non ci sono ' + giorni +
        ' giornate libere di fila da qui.<br>Prova con un altro giorno.</p>';
    }
    controlla();
    return;
  }

  c.innerHTML = '<p class="niente">Controllo gli orari liberi…</p>';
  const s = ROPE.selezione();
  durata = ROPE.durataDellaSelezione(s, scelta);
  const slot = await ROPE.slotLiberi(scelta, durata);

  if(!slot.length){
    c.innerHTML = '<p class="niente">Nessun orario disponibile in questo giorno.<br>' +
                  'Prova con un altro.</p>';
    return;
  }
  if(!slot.some(s => s.libero)){
    c.innerHTML = '<p class="niente">Giornata già piena.<br>Scegli un altro giorno.</p>';
    return;
  }

  c.innerHTML = "";
  slot.forEach(s => {
    const b = document.createElement('button');
    b.className = 'ora'; b.type = 'button'; b.textContent = s.ora;
    b.disabled = !s.libero;
    if(!s.libero) b.title = 'Non disponibile';
    b.setAttribute('aria-pressed', s.ora === ora);
    b.addEventListener('click', () => { ROPE.tocco(); ora = s.ora; disegnaOrari(); controlla(); });
    c.appendChild(b);
  });
}

function controlla(){
  const pronto = !!(scelta && ora);
  $("#avanti").disabled = !pronto;
  if(!pronto){ $("#riconsegna").hidden = true; return; }

  if(giorni > 1){
    const fine = new Date(scelta); fine.setDate(fine.getDate() + giorni - 1);
    $("#riconsegna").hidden = false;
    $("#riconsegna").textContent =
      `Dal ${scelta.getDate()} ${MESI[scelta.getMonth()]} al ` +
      `${fine.getDate()} ${MESI[fine.getMonth()]} — ${giorni} giornate intere`;
    return;
  }

  const [h,m] = ora.split(':').map(Number);
  const fine = new Date(scelta); fine.setHours(h, m + durata, 0, 0);
  const orario = String(fine.getHours()).padStart(2,'0') + ':' +
                 String(fine.getMinutes()).padStart(2,'0');

  $("#riconsegna").hidden = false;
  $("#riconsegna").textContent =
    `${scelta.getDate()} ${MESI[scelta.getMonth()]} dalle ${ora} alle ${orario} ` +
    `(circa ${Math.floor(durata/60)}h${durata % 60 ? String(durata % 60) : ''})`;
}

$("#prec").addEventListener('click', () => {
  vista = new Date(vista.getFullYear(), vista.getMonth()-1, 1); disegnaMese();
});
$("#succ").addEventListener('click', () => {
  vista = new Date(vista.getFullYear(), vista.getMonth()+1, 1); disegnaMese();
});
$("#avanti").addEventListener('click', () => {
  const g = (dati => dati.disponibilita?.giorni?.[String(scelta.getDay()===0?7:scelta.getDay())])(ROPE.dati);
  ROPE.aggiorna({
    data: `${scelta.getDate()} ${MESI[scelta.getMonth()]} ${scelta.getFullYear()}`,
    dataISO: ROPE.dataISO(scelta),
    ora: giorni > 1 ? (g?.da || '08:30') : ora,
    giorni
  });
  location.href = '05-la-tua-auto.html';
});
</script>
</body>
</html>
